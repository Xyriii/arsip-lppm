<ul class="tree-list">
  {% for node in nodes %}
    <li class="tree-item">
      {% if node.children %}
        <details class="tree-details" {% if node.folder.pk in ancestor_ids %}open{% endif %}>
          <summary class="tree-summary">
            <span class="tree-arrow">
              <i data-lucide="chevron-right"></i>
            </span>
            <a href="{% url 'arsip:folder' node.folder.pk %}"
               class="tree-link"
               onclick="event.stopPropagation();">
              <i data-lucide="folder-open"></i>
              <span class="tree-label">{{ node.folder.name }}</span>
            </a>
          </summary>
          <div class="tree-children">
            {% include 'components/tree_node.html' with nodes=node.children ancestor_ids=ancestor_ids current_folder_id=current_folder_id %}
          </div>
        </details>
      {% else %}
        <div class="tree-row-leaf {% if node.folder.pk == current_folder_id %}is-active{% endif %}">
          <span class="tree-arrow-spacer"></span>
          <a href="{% url 'arsip:folder' node.folder.pk %}" class="tree-link">
            <i data-lucide="folder"></i>
            <span class="tree-label">{{ node.folder.name }}</span>
          </a>
        </div>
      {% endif %}
    </li>
  {% endfor %}
</ul>
