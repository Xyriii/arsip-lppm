{% extends 'base.html' %}

{% block title %}Unggah Arsip — Arsip LPPM UNS{% endblock %}

{% block content %}
<div class="container container-narrow">
  <h1>Unggah Arsip</h1>

  <form method="post" enctype="multipart/form-data" class="glass-card">
    {% csrf_token %}

    <div class="form-group">
      <label for="judul">Judul Arsip</label>
      <input type="text" id="judul" name="judul" class="input"
             placeholder="Contoh: Surat Pendanaan 2020" required>
    </div>

    <div class="flex flex-wrap gap-4">
      <div class="form-group" style="flex:1;min-width:140px;">
        <label for="tahun">Tahun</label>
        <input type="number" id="tahun" name="tahun"
               class="input num" min="1999" max="2026"
               placeholder="2024" required>
      </div>
      <div class="form-group" style="flex:1;min-width:140px;">
        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori" class="select" required>
          <option value="">Pilih...</option>
          <option value="surat">Surat</option>
          <option value="sk">SK</option>
          <option value="laporan">Laporan</option>
          <option value="arsip-lama">Arsip Lama</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="deskripsi">Deskripsi (opsional)</label>
      <textarea id="deskripsi" name="deskripsi" class="textarea"
                placeholder="Keterangan singkat tentang arsip ini..."></textarea>
    </div>

    <div class="form-group">
      <label for="file">Berkas (PDF atau XLSX)</label>
      <input type="file" id="file" name="file" class="input"
             accept=".pdf,.xlsx,.xls" required>
    </div>

    <div class="flex justify-between flex-wrap gap-2 mt-6">
      <a href="{% url 'arsip:list' %}" class="btn btn-secondary">Batal</a>
      <button type="submit" class="btn btn-primary">
        <i data-lucide="upload" style="width:18px;height:18px;"></i>
        Unggah
      </button>
    </div>
  </form>
</div>
{% endblock %}
