{% extends 'base.html' %}
{% block title %}404 — Halaman Tidak Ditemukan{% endblock %}

{% block content %}
<div class="error-page-v2">
  <div class="error-content-v2 reveal">
    <div class="error-code-v2">404</div>
    <h1 class="error-title-v2">Halaman Tidak Ditemukan</h1>
    <p class="error-desc-v2">
      Halaman yang Anda cari tidak ada, sudah dipindahkan, atau Anda salah ketik URL.
    </p>
    <div class="error-actions-v2">
      <a href="{% url 'home' %}" class="btn-v2 btn-v2-primary">
        <i data-lucide="home"></i>
        <span>Kembali ke Beranda</span>
      </a>
      <a href="{% url 'arsip:list' %}" class="btn-v2 btn-v2-secondary">
        <i data-lucide="list"></i>
        <span>Lihat Daftar Arsip</span>
      </a>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof lucide !== 'undefined') lucide.createIcons();
    if (typeof initScrollReveal === 'function') initScrollReveal();
  });
</script>
{% endblock %}
